name: Android ARM64 cross-check

on:
  push:
    branches:
      - android/termux
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/android-arm64-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-arm64-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANDROID_NDK_VERSION: 27.2.12479018
      ANDROID_API_LEVEL: 24
      CARGO_BUILD_JOBS: 2
      RUSTC_BOOTSTRAP: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly and Android target
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android

      - name: Install Android NDK
        uses: android-actions/setup-android@v3

      - name: Install pinned NDK
        run: sdkmanager "ndk;${ANDROID_NDK_VERSION}"

      - name: Configure Android linker
        shell: bash
        run: |
          NDK="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android${ANDROID_API_LEVEL}-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android${ANDROID_API_LEVEL}-clang" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-C target-cpu=generic" >> "$GITHUB_ENV"

      - name: Record toolchain
        run: |
          rustc --version --verbose
          cargo --version
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version
          rustup target list --installed

      - name: Cross-check pi-natives for Android ARM64
        shell: bash
        run: |
          set -o pipefail
          cargo check -p pi-natives --target aarch64-linux-android --message-format=short 2>&1 | tee android-cargo-check.log

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-cargo-check
          path: android-cargo-check.log
          if-no-files-found: ignore
          retention-days: 14
